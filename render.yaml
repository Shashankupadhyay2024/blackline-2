services:
  - type: web
    name: blackline-2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL     # free Neon Postgres connection string (set by setup-db.sh)
        sync: false
